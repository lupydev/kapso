[project]
name = "kapso"
version = "0.1.0"
description = "WhatsApp payment collection built on Kapso by a coding agent"
readme = "README.md"
requires-python = ">=3.15"
dependencies = [
    "fastapi[standard]>=0.162.0",
    "httpx>=0.28.1",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.16.1",
    "sqlmodel>=0.0.48",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.fastapi]
entrypoint = "app.main:app"
