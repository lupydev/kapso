name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.database }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        database: [sqlite, postgres]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: kapso_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          # uv decides which CPython it can download; older versions only offer 3.15 alphas.
          version: "0.13.5"
          enable-cache: true
      - run: uv python install
      - run: uv sync --frozen
      - name: Run tests
        run: uv run pytest -q
        env:
          # Empty for the sqlite run: the suite then uses in-memory SQLite.
          TEST_DATABASE_URL: ${{ matrix.database == 'postgres' && 'postgresql://postgres:postgres@localhost:5432/kapso_test' || '' }}

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build the production image
        run: docker build -t kapso-payments .
      - name: Smoke-test the image
        run: |
          docker run -d --name app -p 8000:8000 \
            -e KAPSO_API_KEY=ci -e KAPSO_PHONE_NUMBER_ID=ci -e KAPSO_WEBHOOK_SECRET=ci -e PUBLIC_BASE_URL=http://localhost \
            kapso-payments
          for i in $(seq 1 30); do curl -fsS localhost:8000/health && exit 0; sleep 1; done
          docker logs app; exit 1
