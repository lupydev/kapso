<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Kapso payment collection{% endblock %}</title>
  <style>
    :root {
      --text: #1a1a1a; --muted: #666; --bg: #fff; --line: #e5e5e5; --head: #f6f6f6; --chip: #eee; --code-bg: #f7f7f8;
      --good: #176b35; --good-bg: #e3f5e9; --warn: #8a5a00; --warn-bg: #fdf1d8; --bad: #a61b1b; --bad-bg: #fbe4e4;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --text: #e8e8e8; --muted: #9a9a9a; --bg: #161616; --line: #2c2c2c; --head: #1f1f1f; --chip: #2a2a2a; --code-bg: #1d1d1f;
        --good: #7ddc9b; --good-bg: #173322; --warn: #f0c66b; --warn-bg: #3a2c0d; --bad: #f19a9a; --bad-bg: #3d1717;
      }
    }
    body { background: var(--bg); color: var(--text); font-family: system-ui, sans-serif; max-width: {% block width %}28rem{% endblock %}; margin: 3rem auto; padding: 0 1rem; }
    table { border-collapse: collapse; width: 100%; font-size: 0.9rem; }
    th, td { text-align: left; padding: 0.4rem 0.6rem; border-bottom: 1px solid var(--line); vertical-align: top; }
    th { background: var(--head); }
    code { font-size: 0.8rem; }
    .muted { color: var(--muted); }
  </style>
  {% block head %}{% endblock %}
</head>
<body>
{% block content %}{% endblock %}
</body>
</html>
